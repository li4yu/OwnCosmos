# OwnCosmos · Phase 19 Milvus（数据落在 D:\Milvus）
# 前置：Docker Desktop 已安装并运行（Windows 上经 WSL2 跑 Linux 容器）
# 启动：docker compose -f docker-compose.milvus.yml up -d
# 地址：localhost:19530
# 若 Docker Hub 拉不动，可先：
#   docker pull docker.m.daocloud.io/milvusdb/milvus:v2.5.4
#   docker tag docker.m.daocloud.io/milvusdb/milvus:v2.5.4 milvusdb/milvus:v2.5.4
#   （minio 同理用 daocloud 镜像再 tag）

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_ENABLE_V2: "true"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - D:/Milvus/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - D:/Milvus/minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - D:/Milvus/data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

# 镜像与容器层仍在 Docker（建议装在 D:\Docker）；馆藏向量持久化目录固定 D:\Milvus
